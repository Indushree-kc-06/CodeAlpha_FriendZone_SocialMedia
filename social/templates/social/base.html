{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="csrf-token"
          content="{{ csrf_token }}">

    <title>FriendZone</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{% static 'social/css/style.css' %}">
</head>

<body>

<nav class="fz-navbar">

    <div class="container d-flex align-items-center justify-content-between">

        <a href="{% url 'feed' %}"
           class="fz-logo">

            <i class="bi bi-people-fill"></i>
            FriendZone

        </a>

        <div class="fz-nav-links">

            {% if user.is_authenticated %}

                <a href="{% url 'feed' %}">
                    <i class="bi bi-house-door-fill"></i>
                    <span>Home</span>
                </a>

                <a href="{% url 'search_users' %}">
                    <i class="bi bi-search"></i>
                    <span>Search</span>
                </a>

                <a href="{% url 'create_post' %}">
                    <i class="bi bi-plus-square-fill"></i>
                    <span>Post</span>
                </a>

                <a href="{% url 'profile' user.username %}"
                   class="profile-nav-link">

                    {% if user.profile.profile_photo %}
                        <img src="{{ user.profile.profile_photo.url }}"
                             class="navbar-profile-pic">
                    {% else %}
                        <img src="{{ user.profile.profile_picture }}"
                             class="navbar-profile-pic">
                    {% endif %}

                    <span>Me</span>

                </a>

                <a href="{% url 'logout' %}">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Logout</span>
                </a>

            {% else %}

                <a href="{% url 'login' %}">
                    <i class="bi bi-box-arrow-in-right"></i>
                    <span>Login</span>
                </a>

                <a href="{% url 'register' %}">
                    <i class="bi bi-person-plus-fill"></i>
                    <span>Register</span>
                </a>

            {% endif %}

        </div>

    </div>

</nav>

<main class="container page-wrapper">

    {% block content %}
    {% endblock %}

</main>

<div id="imageModal"
     class="image-modal">

    <span class="close-modal">
        &times;
    </span>

    <img id="modalImage"
         class="modal-image">

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>

<script src="{% static 'social/js/script.js' %}"></script>

</body>

</html>
